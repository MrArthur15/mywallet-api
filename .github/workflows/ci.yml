name: CI - MyWallet API

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Unit & E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mywallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Cliente Prisma e Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mywallet_test?schema=public
        run: |
          npx prisma generate
          npx prisma db push

      - name: Executar Testes Automatizados (Vitest)
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mywallet_test?schema=public
          JWT_SECRET: test-secret-github-actions
        run: npm test