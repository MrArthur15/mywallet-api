version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mywallet-db
    restart: always
    environment:
      POSTGRES_USER: mywallet_user
      POSTGRES_PASSWORD: mywallet_password
      POSTGRES_DB: mywallet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: mywallet-api
    restart: always
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://mywallet_user:mywallet_password@db:5432/mywallet_db?schema=public
      JWT_SECRET: mywallet-production-secret-2026
    ports:
      - "3333:3333"

volumes:
  pgdata: